version: 2.1

jobs:
  build-on-unix:
    type: build
    docker:
      - image: cimg/rust:1.92.0
    steps:
      - run: sudo apt-get update
      - run: sudo apt-get install -y build-essential pkg-config
      - run: sudo apt-get install -y libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libx11-dev libwayland-dev libxkbcommon-dev
      - run: sudo apt-get install -y libfontconfig1-dev libfreetype6-dev
      - run: sudo apt-get install -y libasound2-dev
      - run: sudo apt-get install -y libavcodec-dev libavformat-dev libavutil-dev libswscale-dev libavdevice-dev libavfilter-dev
      - checkout
      - run: cargo build --release
    store_artifacts:
     path: ./target/release/mapmap
        
workflows:
  binary_build:
    jobs:
      - build-on-unix