# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml

trigger:
- develop

pool:
  vmImage: windows-latest

steps:
- script: |
    curl -sSf -o rustup-init.exe https://win.rustup.rs
    rustup-init.exe -y --default-toolchain %RUSTUP_TOOLCHAIN%
    echo "##vso[task.setvariable variable=PATH;]%PATH%;%USERPROFILE%\.cargo\bin"
  displayName: install rust
- script: winget install --source winget --exact --id Microsoft.VisualStudio.2022.Community --override "--passive --config ${GITHUB_WORKSPACE}\wdk.vsconfig"
  displayName: install visual studio community 2022 with C++ toolchain
- script: cargo run --release
  displayName : build the release version
